<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>ASTEROIDS 3D</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="orientationLock" class="orientation-lock hidden" role="alert" aria-live="polite">
  <div class="orientation-lock__card">
    <p class="orientation-lock__icon" aria-hidden="true">↻</p>
    <h2>Please rotate to landscape</h2>
    <p>This game is landscape-only.<br>Rotate your device to continue.</p>
  </div>
</div>

<div id="game-container">
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud" class="sr-only" aria-hidden="true">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">LEVEL<b id="level">1</b></div>
      <div class="stat">LIVES<b id="lives">3</b></div>
    </div>
    <button type="button" class="btn-close-game" id="btnClose" title="Close game" aria-label="Close game">✕</button>
    <div class="topbar">
      <button type="button" class="icon-btn cockpit-hit" id="btnRecenter" title="Reset aim" aria-label="Reset aim">↻</button>
      <button type="button" class="icon-btn mute-toggle cockpit-hit" id="btnMuteMusic" title="Toggle music" aria-label="Toggle music">♫</button>
      <button type="button" class="icon-btn mute-toggle cockpit-hit" id="btnMuteSfx" title="Toggle sound effects" aria-label="Toggle sound effects">FX</button>
    </div>

    <button type="button" class="touch-pad touch-pad--look" id="padLook" aria-label="Drag to look, tap to warp" draggable="false">
      <span class="touch-pad__ring"></span>
      <span class="touch-pad__label">LOOK</span>
      <span class="touch-pad__hint">tap warp</span>
    </button>

    <button type="button" class="touch-pad touch-pad--fire" id="padFire" aria-label="Fire" draggable="false">
      <span class="touch-pad__ring"></span>
      <span class="touch-pad__label">FIRE</span>
    </button>

    <div id="levelFlash" class="level-flash hidden" aria-live="polite"></div>
    <div id="pauseHint" class="pause-hint hidden">PAUSED — press Esc to quit</div>
  </div>

  <div id="startScreen" class="panel open">
    <div class="card">
      <h1>ASTEROIDS 3D</h1>
      <p class="hint" id="seasonHint"></p>
      <p class="hint">iPhone: Add to Home Screen for best fullscreen</p>
      <div class="difficulty">
        <label><input type="radio" name="diff" value="easy"> Easy</label>
        <label><input type="radio" name="diff" value="normal" checked> Normal</label>
        <label><input type="radio" name="diff" value="hard"> Hard</label>
      </div>
      <button class="start" id="btnStart">START</button>
    </div>
  </div>

  <div id="gameOver" class="panel">
    <div class="card">
      <h1 id="goTitle">GAME OVER</h1>
      <p>SCORE <b id="goScore">0</b></p>
      <p>BEST <b id="goHiScore">0</b></p>
      <button class="start" id="btnRestart">TRY AGAIN</button>
    </div>
  </div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
