<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASTEROIDS 3D</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">LEVEL<b id="level">1</b></div>
      <div class="stat">LIVES<b id="lives">3</b></div>
    </div>
    <div class="topbar">
      <button class="icon-btn" id="btnRecenter" title="照準をリセット" aria-label="照準をリセット">↻</button>
      <button class="icon-btn" id="btnMute" title="音声のオン/オフ" aria-label="音声のオン/オフ">🔊</button>
    </div>
  <div class="controls-bar">
      <button type="button" class="control-btn" id="btnThrust" aria-label="スラスト">▲</button>
      <button type="button" class="control-btn" id="btnHyperspace" aria-label="ハイパースペース">✦</button>
    </div>
    <div id="tap-hint">TAP to FIRE</div>
    <div id="levelFlash" class="level-flash hidden" aria-live="polite"></div>
  </div>

  <div id="startScreen" class="panel open">
    <div class="card">
      <h1>ASTEROIDS 3D</h1>
      <p>ジャイロで自機を向ける<br>タップで発射・▲長押しで前進</p>
      <div class="hint">PC: マウスで向き、クリックで発射、Wで前進、H/Shiftでハイパースペース</div>
      <div class="difficulty">
        <label><input type="radio" name="diff" value="easy"> Easy</label>
        <label><input type="radio" name="diff" value="normal" checked> Normal</label>
        <label><input type="radio" name="diff" value="hard"> Hard</label>
      </div>
      <button class="start" id="btnStart">TAP TO START</button>
    </div>
  </div>

  <div id="gameOver" class="panel hidden">
    <div class="card">
      <h1 id="goTitle">GAME OVER</h1>
      <p>SCORE <b id="goScore">0</b></p>
      <p>BEST <b id="goHiScore">0</b></p>
      <button class="start" id="btnRestart">TRY AGAIN</button>
    </div>
  </div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
