<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASTEROIDS 3D</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04040a; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; touch-action: none; }
  body { height: 100dvh; display: flex; align-items: center; justify-content: center; }
  #game-container { position: relative; width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; overflow: hidden; }
  canvas#game { display: block; width: 100%; height: 100%; }

  /* UI - scalable with vw/vh/clamp */
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; }
  #hud { pointer-events: auto; position: absolute; top: 3vh; left: 3vw; right: 3vw; display: flex; justify-content: space-between; font-size: clamp(14px, 3.5vw, 18px); color: #e8e8f0; text-shadow: 0 0 6px rgba(60,120,255,0.6); letter-spacing: 2px; z-index: 15; }
  #hud .stat { margin: 0 14px; }
  #hud b { display: block; font-size: 1.15em; color: #3c78ff; }

  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
  .panel.open { pointer-events: auto; opacity: 1; }
  .card { background: rgba(6,6,16,0.92); border: 1px solid rgba(255,255,255,0.25); padding: clamp(18px, 6vh, 36px) clamp(24px, 9vw, 48px); border-radius: 20px; text-align: center; pointer-events: auto; backdrop-filter: blur(12px); box-shadow: 0 24px 80px rgba(0,0,0,0.7); max-width: 92vw; }
  .card h1 { font-size: clamp(32px, 11vw, 56px); letter-spacing: 10px; color: #3c78ff; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 24px rgba(60,120,255,0.5); }
  .card p { color: rgba(232,232,240,0.9); margin-bottom: 8px; font-size: clamp(15px, 4vw, 20px); line-height: 1.6; }
  .card .hint { font-size: clamp(12px, 3.2vw, 15px); color: rgba(232,232,240,0.55); margin-top: 12px; }
  button.start { margin-top: clamp(14px, 5vh, 24px); padding: clamp(12px, 4vh, 20px) clamp(30px, 10vw, 50px); font-size: clamp(18px, 5.5vw, 24px); border: none; border-radius: 12px; background: #3c78ff; color: #fff; cursor: pointer; font-weight: 800; letter-spacing: 3px; transition: transform 0.1s; box-shadow: 0 0 20px rgba(60,120,255,0.35); }
  button.start:active { transform: scale(0.95); background: #2a5fcc; }

  .topbar { position: absolute; top: 2vh; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 3vw; z-index: 20; pointer-events: auto; }
  .icon-btn { width: clamp(38px, 9vw, 52px); height: clamp(38px, 9vw, 52px); border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(18,18,32,0.6); color: #e8e8f0; font-size: clamp(16px, 4.5vw, 22px); cursor: pointer; display: grid; place-items: center; user-select: none; backdrop-filter: blur(6px); }
  .icon-btn:active { background: rgba(60,120,255,0.35); }

  #tap-hint { position: absolute; bottom: 14vh; left: 0; right: 0; text-align: center; pointer-events: none; font-size: clamp(15px, 4.5vw, 20px); color: rgba(232,232,240,0.7); letter-spacing: 3px; z-index: 12; text-transform: uppercase; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">LIVES<b id="lives">3</b></div>
    </div>
    <div class="topbar">
      <button class="icon-btn" id="btnRecenter" title="recenter">↻</button>
      <button class="icon-btn" id="btnMute" title="mute">🔊</button>
    </div>
    <div id="tap-hint">TAP to FIRE</div>
  </div>

  <div id="startScreen" class="panel open">
    <div class="card">
      <h1>ASTEROIDS 3D</h1>
      <p>ジャイロで自機を向ける<br>タップで発射</p>
      <div class="hint">PC: マウスで向き, クリックで発射, WASDで移動</div>
      <button class="start" id="btnStart">TAP TO START</button>
    </div>
  </div>

  <div id="gameOver" class="panel hidden">
    <div class="card">
      <h1 id="goTitle">GAME OVER</h1>
      <p>SCORE <b id="goScore">0</b></p>
      <button class="start" id="btnRestart">TRY AGAIN</button>
    </div>
  </div>
</div>
<script>
/* ====================== Audio (WebAudio, synthesized) ====================== */
class AudioSys {
  constructor(){ this.ctx=null; this.muted=false; this.master=null; this.noiseBuf=null; this.thrustNode=null; this.thrustGain=null; this.thrustPlaying=false; }
  init(){ if(this.ctx) return; const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return; this.ctx=new Ctx(); this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination); this.master.gain.value=0.5; this._makeNoise(); }
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  setMute(m){ this.muted=!!m; if(this.master) this.master.gain.value=this.muted?0:0.5; if(this.thrustPlaying){ this.thrustGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime+0.15); } }
  _makeNoise(){ if(!this.ctx) return; const len=this.ctx.sampleRate*0.5; this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate); const d=this.noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  _play(type,f0,f1,dur,vol=0.12){ if(this.muted||!this.ctx) return; const t=this.ctx.currentTime; const osc=this.ctx.createOscillator(); const g=this.ctx.createGain(); osc.type=type; osc.frequency.setValueAtTime(f0,t); osc.frequency.linearRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t+dur+0.05); }
  _noiseBurst(dur,vol=0.15,lowpass=true){ if(this.muted||!this.ctx||!this.noiseBuf) return; const t=this.ctx.currentTime; const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true; const g=this.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); const f=lowpass?this.ctx.createBiquadFilter():null; if(f){ f.type='lowpass'; f.frequency.value=1200; src.connect(f); f.connect(g); } else src.connect(g); g.connect(this.master); src.start(t); src.stop(t+dur); }
  playFire(){ this._play('square',700,180,0.10,0.14); }
  playThrustStart(){ if(this.muted||!this.ctx||this.thrustPlaying) return; this.thrustPlaying=true; const t=this.ctx.currentTime; const src=this.ctx.createBufferSource(); src.buffer=this.noiseBuf; src.loop=true; this.thrustNode=src; const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=450; const g=this.ctx.createGain(); this.thrustGain=g; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.12); src.connect(f); f.connect(g); g.connect(this.master); src.start(t); }
  playThrustStop(){ if(!this.thrustPlaying) return; this.thrustPlaying=false; const t=this.ctx.currentTime; if(this.thrustGain) this.thrustGain.gain.linearRampToValueAtTime(0,t+0.15); if(this.thrustNode) this.thrustNode.stop(t+0.2); this.thrustNode=null; this.thrustGain=null; }
  playExplosion(size){ const dur=0.22+(3-size)*0.06; const vol=0.16+(3-size)*0.06; this._noiseBurst(dur,vol,true); this._play('sawtooth',150-size*30,40,dur*0.7,0.10); }
  playShipDie(){ this._noiseBurst(0.5,0.2,false); this._play('sawtooth',200,60,0.5,0.12); }
  playExtraLife(){ this._play('square',800,1200,0.12,0.12); this._play('square',1200,1600,0.12,0.12); }
  playLevelStart(){ this._play('square',400,400,0.1,0.1); this._play('square',500,500,0.1,0.1); this._play('square',650,650,0.1,0.1); }
}
const audio=new AudioSys();

/* ====================== 3D Math helpers ====================== */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(min,max){ return Math.random()*(max-min)+min; }
function dist3(x1,y1,z1,x2,y2,z2){ return Math.sqrt((x2-x1)**2+(y2-y1)**2+(z2-z1)**2); }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function normalize(v){ const l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }

/* Rotate local point (x,y,z) by yaw (around Y) then pitch (around X), then add ship offset */
function rotateShipPoint(x, y, z, yaw, pitch, ox, oy, oz){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  let x1 = x*cy + z*sy;
  let z1 = -x*sy + z*cy;
  let y1 = y;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  let y2 = y1*cp - z1*sp;
  let z2 = y1*sp + z1*cp;
  return {x:x1+ox, y:y2+oy, z:z2+oz};
}

/* ====================== DOM ====================== */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d',{alpha:false});
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');
const startScreen=document.getElementById('startScreen');
const gameOver=document.getElementById('gameOver');
const goScoreEl=document.getElementById('goScore');
const btnStart=document.getElementById('btnStart');
const btnRestart=document.getElementById('btnRestart');
const btnRecenter=document.getElementById('btnRecenter');
const btnMute=document.getElementById('btnMute');
const container=document.getElementById('game-container');

let width,height,dpr;
let cxCanvas, cyCanvas;
function resize(){
  const rect=canvas.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  width=Math.floor(rect.width*dpr);
  height=Math.floor(rect.height*dpr);
  canvas.width=width; canvas.height=height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cxCanvas=width/(dpr*2);
  cyCanvas=height/(dpr*2);
}
window.addEventListener('resize',resize);
resize();

/* ====================== Gyro ====================== */
let beta=0, gamma=0;
let gyroActive=false;
let baseBeta=0, baseGamma=0;
let baselineCaptured=false;
function onDeviceOrientation(e){
  if(e.beta==null||e.gamma==null) return;
  let b=e.beta, g=e.gamma;
  if(Math.abs(b)>90) b = b>0 ? 180-b : -180-b;
  beta=b; gamma=g;
  if(gyroActive && !baselineCaptured){ baseBeta=b; baseGamma=g; baselineCaptured=true; }
}
function requestIOS(){
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(r=>{
      if(r==='granted'){ window.addEventListener('deviceorientation',onDeviceOrientation); gyroActive=true; }
    }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientation',onDeviceOrientation);
    gyroActive=true;
  }
}
window.addEventListener('deviceorientation', e=>{ if(e.beta!=null) onDeviceOrientation(e); });

/* Desktop mouse look */
let mouseYaw=0, mousePitch=0;
window.addEventListener('mousemove', e=>{
  if(state!=='PLAYING') return;
  const mx=(e.clientX/window.innerWidth-0.5)*2;
  const my=(e.clientY/window.innerHeight-0.5)*2;
  mouseYaw = mx * 0.8;
  mousePitch = -my * 0.6;
});

/* ====================== Ship (fixed at screen center) & Camera ====================== */
let ship = { x:0, y:0, z:0, yaw:0, pitch:0, speed:0, radius:14, dead:false };
let camX=0, camY=0, camZ=0;
let camRight=[1,0,0], camUp=[0,1,0], camForward=[0,0,-1];

function getForward(yaw, pitch){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return [sy*cp, -sp, -cy*cp];
}

function updateCamera(){
  let yaw = ship.yaw + mouseYaw;
  let pitch = clamp(ship.pitch + mousePitch, -1.2, 1.2);
  const f = getForward(yaw, pitch);
  const dist = 150;
  // Camera behind ship; ship is at (0,0,0)
  camX = -f[0]*dist;
  camY = -f[1]*dist + 16;
  camZ = -f[2]*dist;
  camForward = f;
  const worldUp=[0,1,0];
  camRight = normalize(cross(camForward, worldUp));
  camUp = normalize(cross(camRight, camForward));
}

function project(x,y,z){
  const dx=x-camX, dy=y-camY, dz=z-camZ;
  const cx = dx*camRight[0]+dy*camRight[1]+dz*camRight[2];
  const cy = dx*camUp[0]+dy*camUp[1]+dz*camUp[2];
  const cz = dx*camForward[0]+dy*camForward[1]+dz*camForward[2];
  if(cz<=0.1) return null;
  const f=650;
  const scale=f/cz;
  return { sx:cx*scale+cxCanvas, sy:cy*scale+cyCanvas, scale, z:cz };
}

/* ====================== Game state ====================== */
let state='START';
let score=0, lives=3, level=1, scoreForLife=10000;
let bullets=[], asteroids=[], particles=[], stars=[];
let keys={};
let frame=0;
let invulnUntil=0;
let fireCooldown=0;
let thrustKeyDown=false;

/* ====================== Input ====================== */
function keydown(e){
  keys[e.code]=true;
  if(state==='START' && (e.code==='Enter'||e.code==='Space')){ startGame(); return; }
  if(state==='GAMEOVER' && e.code==='Enter'){ resetGame(); return; }
  switch(e.code){
    case 'KeyW': case 'ArrowUp': thrustKeyDown=true; break;
  }
}
function keyup(e){
  keys[e.code]=false;
  switch(e.code){
    case 'KeyW': case 'ArrowUp': thrustKeyDown=false; break;
  }
}
window.addEventListener('keydown',keydown);
window.addEventListener('keyup',keyup);

/* Tap to fire on canvas area */
function handlePointerDown(e){
  if(state!=='PLAYING') return;
  if(e.target.tagName==='BUTTON') return;
  shoot();
}
/* Canvas tap to fire; buttons use their own click handlers so they are not blocked */
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); handlePointerDown(e); }, {passive:false});
canvas.addEventListener('mousedown', handlePointerDown);

/* Recenter / Mute */
btnRecenter.addEventListener('click',()=>{
  if(gyroActive){ baseBeta=beta; baseGamma=gamma; baselineCaptured=true; }
  mouseYaw=0; mousePitch=0;
});
btnMute.addEventListener('click',()=>{
  audio.setMute(!audio.muted);
  btnMute.textContent=audio.muted?'🔇':'🔊';
});
btnStart.addEventListener('click',startGame);
btnRestart.addEventListener('click',resetGame);

/* ====================== Game logic ====================== */
function newShip(){ return {x:0,y:0,z:0,yaw:0,pitch:0,speed:0,radius:14,dead:false}; }

function spawnAsteroid(size, ox,oy,oz, vx,vy,vz){
  let x,y,z;
  if(ox!==undefined){x=ox;y=oy;z=oz;}
  else{
    const side=Math.floor(rand(0,6));
    const p=rand(-500,500);
    if(side===0){x=-520;y=0;z=p;}
    else if(side===1){x=520;y=0;z=p;}
    else if(side===2){x=p;y=0;z=-520;}
    else if(side===3){x=p;y=0;z=520;}
    else if(side===4){x=p;y=rand(-80,80);z=rand(-450,450);}
    else {x=rand(-450,450);y=rand(-80,80);z=rand(-450,450);}
  }
  if(vx===undefined) vx=(rand(-1,1))*(0.5+size*0.25);
  if(vy===undefined) vy=rand(-0.3,0.3)*size;
  if(vz===undefined) vz=(rand(-1,1))*(0.5+size*0.25);
  const count=8+Math.floor(rand(0,5));
  const baseR=size*13;
  const verts=[];
  for(let i=0;i<count;i++){
    const a=(i/count)*Math.PI*2;
    const r=baseR*(0.55+0.55*Math.random());
    verts.push({x:Math.cos(a)*r, y:Math.sin(a)*r*0.75, z:Math.sin(a)*r*0.5});
  }
  return {x,y,z,vx,vy,vz,size,verts,angle:0,angleVel:(rand(-1,1))*0.04, radius:baseR};
}

function splitAsteroid(ast){
  if(ast.size<=1) return [];
  const s2=ast.size-1;
  return [
    spawnAsteroid(s2, ast.x,ast.y,ast.z, ast.vx*1.4+(rand(-1,1))*0.2, ast.vy, ast.vz*1.4+(rand(-1,1))*0.2),
    spawnAsteroid(s2, ast.x,ast.y,ast.z, ast.vx*1.4-(rand(-1,1))*0.2, ast.vy, ast.vz*1.4-(rand(-1,1))*0.2)
  ];
}

function addParticle(x,y,z,color,count,speed){
  for(let i=0;i<count;i++){
    const a=rand(0,Math.PI*2);
    const e=rand(0,Math.PI*2);
    const s=rand(0,speed);
    particles.push({x,y,z, vx:Math.cos(a)*Math.sin(e)*s, vy:Math.sin(a)*Math.sin(e)*s, vz:Math.cos(e)*s, life:rand(0.4,1.0), maxLife:1.0, color});
  }
}

function initLevel(){
  ship=newShip();
  bullets=[]; asteroids=[]; particles=[];
  invulnUntil=0;
  const count=6+(level-1);
  for(let i=0;i<count;i++){
    let ast; let tries=0;
    do { ast=spawnAsteroid(3); tries++; } while(dist3(ast.x,ast.y,ast.z,0,0,0)<300 && tries<40);
    asteroids.push(ast);
  }
  audio.playLevelStart();
}

function startGame(){
  audio.init(); audio.resume();
  state='PLAYING';
  score=0; lives=3; level=1; scoreForLife=10000;
  scoreEl.textContent=score; livesEl.textContent=lives;
  startScreen.classList.remove('open');
  gameOver.classList.add('hidden');
  gyroActive=false; baseBeta=0; baseGamma=0; baselineCaptured=false;
  mouseYaw=0; mousePitch=0;
  requestIOS();
  initLevel();
  frame=0;
  loop();
}

function gameOverScreen(){
  state='GAMEOVER';
  goScoreEl.textContent=score;
  gameOver.classList.remove('hidden');
}
function resetGame(){ startGame(); }

function shoot(){
  if(fireCooldown>0) return;
  const f=getForward(ship.yaw, ship.pitch);
  const spd=12;
  bullets.push({
    x:f[0]*ship.radius, y:f[1]*ship.radius, z:f[2]*ship.radius,
    vx:f[0]*spd, vy:f[1]*spd, vz:f[2]*spd,
    life:50
  });
  fireCooldown=10;
  audio.playFire();
}

function updateShip(){
  const acc=0.22, friction=0.982, maxSpeed=9;
  if(thrustKeyDown || keys['KeyW'] || keys['ArrowUp']){
    ship.speed = Math.min(ship.speed+acc, maxSpeed);
    audio.playThrustStart();
  } else {
    ship.speed = Math.max(ship.speed-acc*1.5, 0);
    audio.playThrustStop();
  }
  // Ship position stays fixed at (0,0,0). Only speed changes (used to move environment).
}

function applyGyroToShip(){
  if(!gyroActive) return;
  let b = beta - baseBeta;
  let g = gamma - baseGamma;
  if(Math.abs(b)>90) b = b>0 ? 180-b : -180-b;
  ship.pitch = clamp((b/90)*1.3, -1.1, 1.1);
  ship.yaw = (g/90)*1.6;
}

/* Move environment (asteroids, stars, bullets, particles) opposite to ship's forward direction,
   so it looks like the ship is moving forward through space while staying at screen center. */
function moveEnvironment(){
  const f=getForward(ship.yaw, ship.pitch);
  const mv = ship.speed; // environment moves backward by this amount each frame
  const bound=560;
  function wrapObj(o){
    if(o.x>bound) o.x=-bound; if(o.x<-bound) o.x=bound;
    if(o.z>bound) o.z=-bound; if(o.z<-bound) o.z=bound;
    if(o.y>140) o.y=140; if(o.y<-140) o.y=-140;
  }
  for(const a of asteroids){
    a.x -= f[0]*mv + a.vx;
    a.y -= f[1]*mv + a.vy;
    a.z -= f[2]*mv + a.vz;
    a.angle+=a.angleVel;
    wrapObj(a);
  }
  for(const b of bullets){
    b.x -= f[0]*mv + b.vx;
    b.y -= f[1]*mv + b.vy;
    b.z -= f[2]*mv + b.vz;
    b.life--;
    wrapObj(b);
    if(b.life<=0) { /* removed below */ }
  }
  // remove dead bullets
  for(let i=bullets.length-1;i>=0;i--){ if(bullets[i].life<=0) bullets.splice(i,1); }
  for(const p of particles){
    p.x -= f[0]*mv + p.vx;
    p.y -= f[1]*mv + p.vy;
    p.z -= f[2]*mv + p.vz;
    p.life-=0.04;
  }
  for(let i=particles.length-1;i>=0;i--){ if(particles[i].life<=0) particles.splice(i,1); }
  for(const s of stars){
    s.x -= f[0]*mv*0.6;
    s.y -= f[1]*mv*0.6;
    s.z -= f[2]*mv*0.6;
    const sb=900;
    if(s.x<-sb) s.x+=sb*2; if(s.x>sb) s.x-=sb*2;
    if(s.y<-sb) s.y+=sb*2; if(s.y>sb) s.y-=sb*2;
    if(s.z<-sb) s.z+=sb*2; if(s.z>sb) s.z-=sb*2;
  }
}

function checkCollisions(){
  if(!ship || ship.dead) return;
  // ship is at (0,0,0)
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    let hit=false;
    for(let ai=asteroids.length-1;ai>=0;ai--){
      const a=asteroids[ai];
      if(dist3(b.x,b.y,b.z,a.x,a.y,a.z)<a.radius+4){
        hit=true;
        audio.playExplosion(a.size);
        score += a.size===1?100: a.size===2?50:20;
        if(score>=scoreForLife){ lives++; scoreForLife+=10000; livesEl.textContent=lives; audio.playExtraLife(); }
        scoreEl.textContent=score;
        const children=splitAsteroid(a);
        asteroids.splice(ai,1);
        asteroids.push(...children);
        addParticle(a.x,a.y,a.z,'#fff', a.size===1?6:a.size===2?12:18, a.size===1?2:a.size===2?3:4);
        bullets.splice(bi,1);
        break;
      }
    }
    if(hit) continue;
  }
  if(Date.now()>=invulnUntil){
    for(const a of asteroids){
      if(dist3(0,0,0,a.x,a.y,a.z)<ship.radius+a.radius*0.85){
        dieShip();
        return;
      }
    }
  }
}

function dieShip(){
  ship.dead=true;
  lives--;
  audio.playShipDie();
  audio.playThrustStop();
  addParticle(0,0,0,'#fff',24,7);
  addParticle(0,0,0,'#ff4444',16,6);
  scoreEl.textContent=score; livesEl.textContent=lives;
  if(lives<0){
    setTimeout(gameOverScreen,700);
  } else {
    invulnUntil=Date.now()+2200;
    setTimeout(()=>{ ship=newShip(); ship.dead=false; },1500);
  }
}

function nextLevelIfClear(){
  if(asteroids.length===0){ level++; initLevel(); }
}

/* ====================== Rendering ====================== */
function drawStarfield(){
  ctx.fillStyle='#06060e';
  ctx.fillRect(0,0,width/dpr,height/dpr);
  const sorted=stars.slice().sort((a,b)=>b.z-a.z);
  for(const s of sorted){
    const p=project(s.x,s.y,s.z);
    if(!p) continue;
    const alpha=0.35+0.65*(1-clamp(p.z/1300,0,1));
    ctx.fillStyle=`rgba(180,205,255,${alpha})`;
    const sz=1.1*p.scale;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,sz,0,Math.PI*2); ctx.fill();
  }
}

/* 3D wireframe spaceship - sharp design like reference */
const SHIP_MODEL = [
  {x:  0,  y: 14,  z: 26},   // 0 nose top
  {x: -6,  y:  8,  z: 18},   // 1 cockpit left
  {x:  6,  y:  8,  z: 18},   // 2 cockpit right
  {x: -16, y:  0,  z: 12},   // 3 left wing inner
  {x:  16, y:  0,  z: 12},   // 4 right wing inner
  {x: -24, y: -2,  z:  8},   // 5 left wing tip
  {x:  24, y: -2,  z:  8},   // 6 right wing tip
  {x: -6,  y: -8,  z: 18},   // 7 body bottom left
  {x:  6,  y: -8,  z: 18},   // 8 body bottom right
  {x: -10, y:  6,  z: -10},  // 9 rear top left
  {x:  10, y:  6,  z: -10},  // 10 rear top right
  {x: -10, y: -6,  z: -10},  // 11 rear bottom left
  {x:  10, y: -6,  z: -10},  // 12 rear bottom right
  {x: -8,  y:  0,  z: -22},  // 13 nozzle left
  {x:  8,  y:  0,  z: -22},  // 14 nozzle right
  {x:  0,  y: -10, z: -28}   // 15 engine bottom
];
const SHIP_EDGES = [
  [0,1],[0,2],[1,2],                    // cockpit
  [1,3],[2,4],                          // body to wing inner
  [3,5],[4,6],                          // wing inner to tip
  [5,7],[6,8],                          // wing tip to body bottom
  [3,7],[4,8],                          // wing inner to body bottom
  [7,8],                                // body bottom bar
  [3,9],[4,10],                         // body top to rear top
  [7,11],[8,12],                        // body bottom to rear bottom
  [9,10],[11,12],                       // rear bars
  [9,13],[10,13],[11,14],[12,14],[13,14]// nozzles
];

function drawShip(){
  if(!ship || ship.dead) return;
  if(Date.now()<invulnUntil && Math.floor(Date.now()/80)%2===0) return;

  const projected=[];
  for(const v of SHIP_MODEL){
    const rp=rotateShipPoint(v.x, v.y, v.z, ship.yaw, ship.pitch, 0,0,0);
    const p=project(rp.x, rp.y, rp.z);
    projected.push(p);
  }
  if(projected.every(p=>!p)) return;

  // thrust flame (from two nozzles)
  const thrusting = thrustKeyDown || keys['KeyW'] || keys['ArrowUp'];
  if(thrusting && ship.speed>0.3){
    const fl=16+Math.random()*8;
    const nz=-22-fl;
    const f1=rotateShipPoint(0, 0, nz, ship.yaw, ship.pitch, 0,0,0);
    const f2=rotateShipPoint(-6, 0, nz+4, ship.yaw, ship.pitch, 0,0,0);
    const f3=rotateShipPoint( 6, 0, nz+4, ship.yaw, ship.pitch, 0,0,0);
    const pf1=project(f1.x,f1.y,f1.z);
    const pf2=project(f2.x,f2.y,f2.z);
    const pf3=project(f3.x,f3.y,f3.z);
    const p13=projected[13], p14=projected[14];
    if(pf1&&pf2&&pf3){
      const sx=(p13?p13.sx:0 + p14?p14.sx:0)/2;
      const sy=(p13?p13.sy:0 + p14?p14.sy:0)/2;
      const grad=ctx.createLinearGradient(sx, sy, pf1.sx, pf1.sy);
      grad.addColorStop(0,'rgba(255,90,20,0.9)');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.moveTo(pf2.sx,pf2.sy); ctx.lineTo(pf1.sx,pf1.sy); ctx.lineTo(pf3.sx,pf3.sy); ctx.fill();
    }
  }

  // ship body (wireframe)
  ctx.strokeStyle='#3c78ff';
  ctx.lineWidth=2.4;
  ctx.beginPath();
  let firstEdge=true;
  for(const [i,j] of SHIP_EDGES){
    const pi=projected[i], pj=projected[j];
    if(!pi||!pj){ firstEdge=true; continue; }
    if(firstEdge){ ctx.moveTo(pi.sx,pi.sy); firstEdge=false; }
    ctx.lineTo(pj.sx,pj.sy);
  }
  ctx.stroke();

  // vertex dots (like reference image)
  ctx.fillStyle='#3c78ff';
  for(const p of projected){
    if(!p) continue;
    ctx.beginPath(); ctx.arc(p.sx,p.sy,1.8*p.scale,0,Math.PI*2); ctx.fill();
  }
}

function drawAsteroid(a){
  const projected=[];
  for(const v of a.verts) projected.push(project(a.x+v.x,a.y+v.y,a.z+v.z));
  if(projected.every(p=>!p)) return;
  ctx.strokeStyle='#d8d8f0';
  ctx.lineWidth=2;
  ctx.beginPath();
  let first=true;
  for(const p of projected){
    if(!p){first=true;continue;}
    if(first){ctx.moveTo(p.sx,p.sy);first=false;}
    else ctx.lineTo(p.sx,p.sy);
  }
  ctx.stroke();
}

function drawBullet(b){
  const p=project(b.x,b.y,b.z);
  if(!p) return;
  ctx.fillStyle='#fff';
  const r=2.2*p.scale;
  ctx.beginPath(); ctx.arc(p.sx,p.sy,r,0,Math.PI*2); ctx.fill();
}

function drawParticles(){
  const sorted=particles.slice().sort((a,b)=>b.z-a.z);
  for(const p of sorted){
    const pp=project(p.x,p.y,p.z);
    if(!pp) continue;
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    const r=1.5*pp.scale;
    ctx.beginPath(); ctx.arc(pp.sx,pp.sy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  updateCamera();
  drawStarfield();
  for(const a of asteroids) drawAsteroid(a);
  drawShip();
  for(const b of bullets) drawBullet(b);
  drawParticles();
}

/* ====================== Main loop ====================== */
function loop(){
  if(state!=='PLAYING') return;
  frame++;
  if(fireCooldown>0) fireCooldown--;
  applyGyroToShip();
  updateShip();
  moveEnvironment();
  checkCollisions();
  nextLevelIfClear();
  draw();
  requestAnimationFrame(loop);
}

/* Stars init */
function initStars(){
  stars=[];
  for(let i=0;i<160;i++) stars.push({x:rand(-900,900), y:rand(-150,150), z:rand(-900,900)});
}
initStars();

</script>
