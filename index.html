<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASTEROIDS 3D</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud">
      <div class="stat">SCORE<b id="score">0</b></div>
      <div class="stat">LEVEL<b id="level">1</b></div>
      <div class="stat">LIVES<b id="lives">3</b></div>
    </div>
    <div class="topbar">
      <button class="icon-btn" id="btnRecenter" title="照準リセット" aria-label="照準リセット">↻</button>
      <button class="icon-btn" id="btnMute" title="ミュート" aria-label="ミュート">🔊</button>
      <button class="icon-btn" id="btnQuit" title="終了 (Esc)" aria-label="終了">✕</button>
    </div>

    <div class="touch-pad touch-pad--look" id="padLook" aria-label="ドラッグで向き・タップでワープ">
      <span class="touch-pad__ring"></span>
      <span class="touch-pad__label">LOOK</span>
      <span class="touch-pad__hint">tap warp</span>
    </div>

    <button type="button" class="touch-pad touch-pad--fire" id="padFire" aria-label="発射">
      <span class="touch-pad__ring"></span>
      <span class="touch-pad__label">FIRE</span>
    </button>

    <div id="levelFlash" class="level-flash hidden" aria-live="polite"></div>
    <div id="pauseHint" class="pause-hint hidden">PAUSED — Esc で終了</div>
  </div>

  <div id="startScreen" class="panel open">
    <div class="card">
      <h1>ASTEROIDS 3D</h1>
      <p>コックピットから宇宙を見渡す<br>左下ドラッグで回転・同位置タップでワープ</p>
      <div class="hint">右下タップで発射 · Esc / ✕ で終了 · 🔇 ミュート</div>
      <div class="difficulty">
        <label><input type="radio" name="diff" value="easy"> Easy</label>
        <label><input type="radio" name="diff" value="normal" checked> Normal</label>
        <label><input type="radio" name="diff" value="hard"> Hard</label>
      </div>
      <button class="start" id="btnStart">START</button>
    </div>
  </div>

  <div id="gameOver" class="panel hidden">
    <div class="card">
      <h1 id="goTitle">GAME OVER</h1>
      <p>SCORE <b id="goScore">0</b></p>
      <p>BEST <b id="goHiScore">0</b></p>
      <button class="start" id="btnRestart">TRY AGAIN</button>
    </div>
  </div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
